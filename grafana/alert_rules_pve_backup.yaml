      relativeTimeRange:
        from: 600
        to: 0
      model:
        application:
          filter: ''
        countTriggersBy: ''
        datasource: &id003
          type: alexanderzobnin-zabbix-datasource
          uid: bfsa9hm2vclq8c
        evaltype: '0'
        functions: []
        group:
          filter: Linux servers
        host:
          filter: /^(pve1|pve2|pve3|pve4)$/
        intervalMs: 1000
        item:
          filter: '/^Node \[[^\]]+\]: CPU utilization$/'
        itemTag:
